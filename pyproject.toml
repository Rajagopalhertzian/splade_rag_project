[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splade-rag"
version = "1.0.0"
description = "SPLADE-based Retrieval-Augmented Generation System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "RAG Project", email = "rag@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "sentence-transformers>=2.2.0",
    "huggingface-hub>=0.19.0",
    "safetensors>=0.4.0",
    "elasticsearch>=8.10.0",
    "rank-bm25>=0.2.2",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
train = ["datasets>=2.14.0", "evaluate>=0.4.0", "scikit-learn>=1.3.0"]
web = ["streamlit>=1.28.0", "fastapi>=0.104.0", "uvicorn>=0.24.0"]
dev = ["pytest>=7.4.0", "black>=23.0.0", "ruff>=0.1.0"]
all = [
    "datasets>=2.14.0", "evaluate>=0.4.0", "scikit-learn>=1.3.0",
    "streamlit>=1.28.0", "fastapi>=0.104.0", "uvicorn>=0.24.0",
    "pytest>=7.4.0", "black>=23.0.0", "ruff>=0.1.0"
]

[project.scripts]
splade-build-index = "scripts.build_index:main"
splade-query = "scripts.query_rag:main"
splade-train = "scripts.train_splade:main"
splade-evaluate = "scripts.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["../config/*.yaml", "../docs/*.doc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH"]
ignore = ["E501", "B008"]